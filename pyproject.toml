[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demandlens"
version = "0.1.0"
description = "Leakage-tested retail sales forecasting and inventory scenarios"
requires-python = ">=3.11,<3.12"

[tool.setuptools]
packages = ["demandlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
